<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ranking da turma</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F1; color: #13211C; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
<main style="flex: 1; overflow-y: auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.5px">Ranking</h1>
<span style="font-size: 14px; color: #55635D">Eletrotécnica 2º A · Liga Cobre</span>
</header>

<div role="group" aria-label="Período" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E2E7E3">
<button aria-pressed="true" style="min-height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #13211C; font: 600 14px 'IBM Plex Sans', sans-serif">Semana</button>
<button aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: #55635D; font: 500 14px 'IBM Plex Sans', sans-serif">Mês</button>
<button aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: #55635D; font: 500 14px 'IBM Plex Sans', sans-serif">Geral</button>
</div>

<section aria-label="Pódio" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; padding-top: 6px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 52px; height: 52px; border-radius: 26px; background: #CBD5E1; display: flex; align-items: center; justify-content: center; font-weight: 600">JP</span>
<span style="font-size: 13px; font-weight: 600">João P.</span>
<div style="width: 100%; height: 76px; border-radius: 12px 12px 0 0; background: #FFFFFF; border: 1px solid #DCE2DD; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">2</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55635D">610 XP</span></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 60px; height: 60px; border-radius: 30px; background: #F59E0B; color: #13211C; display: flex; align-items: center; justify-content: center; font-weight: 600; box-shadow: 0 0 0 4px #FDE7C0">MC</span>
<span style="font-size: 13px; font-weight: 600">Maria C.</span>
<div style="width: 100%; height: 104px; border-radius: 12px 12px 0 0; background: #13211C; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; color: #FBBF24">1</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #B9C6BF">745 XP</span></div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="width: 52px; height: 52px; border-radius: 26px; background: #E8C7A8; display: flex; align-items: center; justify-content: center; font-weight: 600">LR</span>
<span style="font-size: 13px; font-weight: 600">Lucas R.</span>
<div style="width: 100%; height: 60px; border-radius: 12px 12px 0 0; background: #FFFFFF; border: 1px solid #DCE2DD; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">3</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #55635D">580 XP</span></div>
</div>
</section>

<div style="background: #E3EBFD; color: #1E3A8A; border-radius: 12px; padding: 10px 12px; font-size: 13px; display: flex; gap: 8px; align-items: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
<span>Os 3 primeiros sobem para a <b>Liga Prata</b> no domingo.</span>
</div>

<ol start="4" aria-label="Demais posições" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<sc-if value="{{r.me}}" hint-placeholder-val="{{ false }}">
<li style="min-height: 56px; padding: 0 14px; border-radius: 14px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; gap: 12px">
<span style="width: 24px; font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{r.pos}}</span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #FFFFFF; color: #1D4ED8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{r.ini}}</span>
<span style="flex: 1; font-weight: 600">{{r.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600">{{r.xp}}</span>
</li>
</sc-if>
<sc-if value="{{r.other}}" hint-placeholder-val="{{ true }}">
<li style="min-height: 56px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DCE2DD; display: flex; align-items: center; gap: 12px">
<span style="width: 24px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: #55635D">{{r.pos}}</span>
<span style="width: 36px; height: 36px; border-radius: 18px; background: #E6EBE7; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{r.ini}}</span>
<span style="flex: 1; font-weight: 500">{{r.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #55635D">{{r.xp}}</span>
</li>
</sc-if>
</sc-for>
</ol>
</main>

<nav aria-label="Navegação principal" style="display: flex; justify-content: space-around; align-items: center; height: 76px; border-top: 1px solid #DCE2DD; background: #FFFFFF; padding: 0 8px 8px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 500; color: #55635D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Início</a>
<a href="Trilhas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 500; color: #55635D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"></path></svg>Trilhas</a>
<a href="Ranking.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #1D4ED8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Ranking</a>
<a href="Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 500; color: #55635D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const data = [
{ pos: 4, ini: 'BF', name: 'Beatriz F.', xp: '540 XP' },
{ pos: 5, ini: 'AS', name: 'Ana S. (você)', xp: '515 XP', me: true },
{ pos: 6, ini: 'GT', name: 'Gabriel T.', xp: '470 XP' },
{ pos: 7, ini: 'RM', name: 'Rafael M.', xp: '430 XP' },
{ pos: 8, ini: 'CL', name: 'Camila L.', xp: '395 XP' }
];
return { rows: data.map((r) => ({ ...r, me: !!r.me, other: !r.me })) };
}
}
</script>
</body>
</html>

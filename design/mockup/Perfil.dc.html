<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Perfil e medalhas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F1; color: #13211C; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
<main style="flex: 1; overflow-y: auto; padding: 24px 20px 16px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; gap: 14px; align-items: center">
<span style="width: 64px; height: 64px; border-radius: 32px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 22px">AS</span>
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">Ana Souza</h1>
<span style="font-size: 13px; color: #55635D">Nível Afiado II · Liga Cobre</span>
</div>
</header>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px">1.240</span><span style="font-size: 12px; color: #55635D">XP total</span></div>
<div style="background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px">186</span><span style="font-size: 12px; color: #55635D">questões</span></div>
<div style="background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 17px">74%</span><span style="font-size: 12px; color: #55635D">de acerto</span></div>
</div>

<section aria-labelledby="dias" style="background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="dias" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 17px">Dias de estudo</h2>
<span style="font-size: 12px; color: #B45309; font-weight: 600">13 dias seguidos</span>
</div>
<div role="img" aria-label="Calendário das últimas 5 semanas com os dias estudados" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="35">
<sc-if value="{{d.on}}" hint-placeholder-val="{{ false }}"><span style="height: 30px; border-radius: 6px; background: #F59E0B"></span></sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{ true }}"><span style="height: 30px; border-radius: 6px; background: #E6EBE7"></span></sc-if>
</sc-for>
</div>
</section>

<section aria-labelledby="medalhas" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h2 id="medalhas" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 17px">Medalhas</h2>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #55635D">9 de 24</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{badges}}" as="b" hint-placeholder-count="6">
<sc-if value="{{b.earned}}" hint-placeholder-val="{{ true }}">
<li style="background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 48px; height: 48px; border-radius: 24px; background: #13211C; color: #FBBF24; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">{{b.glyph}}</span>
<span style="font-size: 12px; font-weight: 600; line-height: 1.25">{{b.name}}</span>
</li>
</sc-if>
<sc-if value="{{b.locked}}" hint-placeholder-val="{{ false }}">
<li style="background: transparent; border: 1px dashed #A9B5AF; border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<span style="width: 48px; height: 48px; border-radius: 24px; background: #E6EBE7; color: #6B7872; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
<span style="font-size: 12px; font-weight: 500; line-height: 1.25; color: #55635D">{{b.name}}</span>
</li>
</sc-if>
</sc-for>
</ul>
</section>
</main>

<nav aria-label="Navegação principal" style="display: flex; justify-content: space-around; align-items: center; height: 76px; border-top: 1px solid #DCE2DD; background: #FFFFFF; padding: 0 8px 8px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 500; color: #55635D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>Início</a>
<a href="Trilhas.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 500; color: #55635D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8"></path></svg>Trilhas</a>
<a href="Ranking.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 500; color: #55635D"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"></path></svg>Ranking</a>
<a href="Perfil.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; font-weight: 600; color: #1D4ED8"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Perfil</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pattern = '1011010110111001101111111111111110000';
const days = [];
for (let i = 0; i < 35; i++) {
const on = pattern.charAt(i) === '1';
days.push({ on: on, off: !on });
}
const list = [
{ glyph: 'Ω', name: 'Mestre de Ohm', earned: true },
{ glyph: 'W', name: 'Potência Total', earned: true },
{ glyph: '7', name: '7 dias seguidos', earned: true },
{ glyph: '★', name: 'Primeira trilha', earned: false },
{ glyph: '∥', name: 'Rei do Paralelo', earned: false },
{ glyph: 'K', name: 'Kirchhoff', earned: false }
];
return {
days: days,
badges: list.map((b) => ({ ...b, locked: !b.earned }))
};
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desafio relâmpago</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F5F1; color: #13211C; font-family: 'IBM Plex Sans', sans-serif; overflow: hidden">
<header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Main.dc.html" aria-label="Sair do desafio" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DCE2DD; color: #13211C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div style="display: flex; gap: 8px">
<span style="min-height: 32px; padding: 0 12px; border-radius: 16px; background: #13211C; color: #FBBF24; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg>Combo x2</span>
<span style="min-height: 32px; padding: 0 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DCE2DD; display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>0:42</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #55635D"><span>Lei de Ohm · Desafio relâmpago</span><span style="font-family: 'IBM Plex Mono', monospace">3/5</span></div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px" role="img" aria-label="Questão 3 de 5">
<span style="height: 6px; border-radius: 3px; background: #15803D"></span>
<span style="height: 6px; border-radius: 3px; background: #15803D"></span>
<span style="height: 6px; border-radius: 3px; background: #1D4ED8"></span>
<span style="height: 6px; border-radius: 3px; background: #DCE2DD"></span>
<span style="height: 6px; border-radius: 3px; background: #DCE2DD"></span>
</div>
</div>
</header>

<main style="flex: 1; overflow-y: auto; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 18px">
<section style="background: #FFFFFF; border: 1px solid #DCE2DD; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div role="img" aria-label="Circuito: fonte de 12 volts em série com resistor de 220 ohms" style="height: 120px; border-radius: 12px; background: #F3F5F1; display: flex; align-items: center; justify-content: center">
<svg width="240" height="100" viewBox="0 0 240 100" fill="none" stroke="#13211C" stroke-width="2" stroke-linecap="round" aria-hidden="true">
<path d="M40 30V20h70M150 20h50v60H40V70"></path>
<path d="M110 20l5-8 8 16 8-16 8 16 8-16 3 8"></path>
<path d="M28 42h24M34 50h12M28 58h24M34 66h12"></path>
<path d="M40 30v12M40 66v4"></path>
<text x="12" y="56" fill="#13211C" stroke="none" font-family="IBM Plex Mono, monospace" font-size="12">12 V</text>
<text x="112" y="46" fill="#13211C" stroke="none" font-family="IBM Plex Mono, monospace" font-size="12">220 Ω</text>
<text x="196" y="96" fill="#1D4ED8" stroke="none" font-family="IBM Plex Mono, monospace" font-size="12">I = ?</text>
</svg>
</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.3">Um resistor de 220 Ω é ligado a uma fonte de 12 V. Qual é a corrente aproximada no circuito?</h1>
</section>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Escolha uma alternativa</legend>
<sc-for list="{{options}}" as="opt" hint-placeholder-count="4">
<sc-if value="{{opt.selected}}" hint-placeholder-val="{{ false }}">
<button aria-pressed="true" onClick="{{opt.pick}}" style="min-height: 56px; padding: 0 16px; border-radius: 14px; border: 2px solid #1D4ED8; background: #E3EBFD; color: #13211C; display: flex; align-items: center; gap: 14px; text-align: left; font: 500 16px 'IBM Plex Sans', sans-serif; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{opt.letter}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 600">{{opt.text}}</span>
</button>
</sc-if>
<sc-if value="{{opt.notSelected}}" hint-placeholder-val="{{ true }}">
<button aria-pressed="false" onClick="{{opt.pick}}" style="min-height: 56px; padding: 0 16px; border-radius: 14px; border: 1px solid #DCE2DD; background: #FFFFFF; color: #13211C; display: flex; align-items: center; gap: 14px; text-align: left; font: 500 16px 'IBM Plex Sans', sans-serif; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #F3F5F1; color: #13211C; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{opt.letter}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-weight: 500">{{opt.text}}</span>
</button>
</sc-if>
</sc-for>
</fieldset>
</main>

<footer style="padding: 12px 20px 24px; display: flex; gap: 10px; border-top: 1px solid #DCE2DD; background: #FFFFFF">
<button style="min-height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #DCE2DD; background: #FFFFFF; color: #13211C; display: flex; align-items: center; gap: 6px; font: 600 14px 'IBM Plex Sans', sans-serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"></path></svg>Dica −10 XP</button>
<a href="Resultado.dc.html" style="flex: 1; min-height: 52px; border-radius: 14px; background: #1D4ED8; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; text-decoration: none">Confirmar</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { picked: 'B' };
}
renderVals() {
const raw = [
{ letter: 'A', text: '2,64 A' },
{ letter: 'B', text: '54,5 mA' },
{ letter: 'C', text: '18,3 mA' },
{ letter: 'D', text: '0,54 A' }
];
const picked = this.state.picked;
const options = raw.map((o) => ({
letter: o.letter,
text: o.text,
selected: picked === o.letter,
notSelected: picked !== o.letter,
pick: () => this.setState({ picked: o.letter })
}));
return { options: options };
}
}
</script>
</body>
</html>

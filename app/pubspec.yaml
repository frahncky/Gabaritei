name: gabaritei
description: App de gamificação de estudos para o ensino médio técnico e regular.
publish_to: 'none'
version: 0.3.0+3

environment:
  # Alinhado aos requisitos das dependências em pubspec.lock.
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  fonts:
    - family: GabariteiTechnical
      fonts:
        - asset: assets/fonts/GabariteiTechnical.ttf
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-600.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700

# Ícone e splash gerados a partir de assets/brand/ (ver tool/brand_assets_test.dart).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0F1D33"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  # A marca já vem desenhada na zona segura; o recuo padrão de 16% a encolheria.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F1D33"
  image: assets/brand/splash.png
  android_12:
    color: "#0F1D33"
    image: assets/brand/splash_android12.png
    icon_background_color: "#0F1D33"
  ios: false
  web: false
